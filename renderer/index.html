<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none';" />
<title>TimeProof</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>TimeProof</h1>
    <span class="tagline">Proof of Work, Without Manual Timesheets</span>
  </header>

  <main>
    <section id="timesheet">
      <div class="section-header">
        <h2>Today's Timesheet</h2>
        <span>
          <span id="total-hours"></span>
          <button id="refresh-btn">Refresh</button>
        </span>
      </div>
      <p id="integrity-status" class="integrity"></p>
      <table id="timesheet-table">
        <thead>
          <tr><th>Project</th><th>Hours</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="timesheet-body"></tbody>
      </table>
    </section>

    <section id="evidence" class="hidden">
      <div class="section-header">
        <h2 id="evidence-title">Evidence</h2>
        <button id="close-evidence">Close</button>
      </div>
      <ul id="evidence-list"></ul>
    </section>

    <section id="privacy">
      <h2>Privacy — What's being collected</h2>
      <ul id="privacy-collects"></ul>
      <h3>Never collected</h3>
      <ul id="privacy-never"></ul>
      <label class="toggle">
        <input type="checkbox" id="screenshots-toggle" />
        Enable screenshots (blurred, off by default)
      </label>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
